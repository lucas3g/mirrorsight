[package]
name = "mirrorsight-infrastructure"
description = "Adapters concretos dos ports do Mirrorsight (Win32, HTTP, filesystem)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mirrorsight-domain.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
base64 = "0.23.1"
tokio = { workspace = true, features = ["time", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "http2"] }
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security"] }

[dev-dependencies]
mirrorsight-application.workspace = true
mirrorsight-parser.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
