name: Release

# Gera uma nova versão: atualiza a versão nos manifestos, roda os testes, compila o instalador
# NSIS, faz o commit + tag `vX.Y.Z` e publica a Release no GitHub com o .exe para download.
#
# Uso: Actions → Release → Run workflow → informe a versão (ex.: 0.2.0).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nova versão (semver, sem o 'v'). Ex.: 0.2.0"
        required: true
        type: string
      prerelease:
        description: "Marcar como pré-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish v${{ inputs.version }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versão inválida: '$VERSION'. Use semver, ex.: 0.2.0"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::A tag $TAG já existe."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Bump version
        run: |
          # Cargo workspace (todos os crates herdam `version.workspace = true`)
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const cargo = fs.readFileSync("Cargo.toml", "utf8");
            const re = /(\[workspace\.package\][^\[]*?\bversion\s*=\s*")[^"]*(")/;
            if (!re.test(cargo)) throw new Error("version não encontrada em [workspace.package]");
            fs.writeFileSync("Cargo.toml", cargo.replace(re, `$1${v}$2`));
            const confPath = "apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = v;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
          '
          # package.json + package-lock.json
          (cd apps/desktop && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          # Atualiza só os pacotes do workspace no Cargo.lock
          cargo update --workspace
          git --no-pager diff --stat

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test
        run: |
          cargo test --workspace --locked
          (cd apps/desktop && npm run check)

      - name: Build installer
        working-directory: apps/desktop
        run: npx tauri build

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p dist-release
          installer=$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)
          if [ -z "$installer" ]; then echo "::error::Instalador não encontrado"; exit 1; fi
          name="Mirrorsight_${VERSION}_x64-setup.exe"
          cp "$installer" "dist-release/$name"
          (cd dist-release && sha256sum "$name" > SHA256SUMS.txt)
          cat dist-release/SHA256SUMS.txt
          echo "installer=$name" >> "$GITHUB_OUTPUT"

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG"
          fi
          git tag -a "$TAG" -m "Mirrorsight $TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Create GitHub Release
        run: |
          installer="${{ steps.artifacts.outputs.installer }}"
          cat > notes.md <<EOF
          ## 📥 Download

          **Windows 10/11 (x64):** [\`$installer\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${installer})

          1. Baixe e execute o instalador. O Mirrorsight fica na bandeja do sistema.
          2. Em **Configurações → Geral**, escolha o jogo (PoE 1 / PoE 2) e a liga.
          3. No jogo, passe o mouse sobre um item e pressione **Ctrl + D**.

          > O instalador não é assinado digitalmente: se o Windows SmartScreen avisar,
          > clique em **Mais informações → Executar assim mesmo**.
          > Confira a integridade com o \`SHA256SUMS.txt\`.

          ---
          EOF

          flags=(--title "Mirrorsight $TAG" --notes-file notes.md --generate-notes --verify-tag)
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi

          gh release create "$TAG" "dist-release/$installer" dist-release/SHA256SUMS.txt "${flags[@]}"
