name: Release

# Gera uma nova versão: atualiza a versão nos manifestos, roda os testes, compila o instalador
# NSIS, mergeia o commit de versão via PR (a `main` é protegida), cria a tag `vX.Y.Z` e publica
# a Release no GitHub com o .exe para download.
# Também publica o `latest.json` + `.sig` usados pela atualização automática dos apps instalados
# (secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
#
# Uso: Actions → Release → Run workflow → informe a versão (ex.: 0.2.0).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nova versão (semver, sem o 'v'). Ex.: 0.2.0"
        required: true
        type: string
      prerelease:
        description: "Marcar como pré-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish v${{ inputs.version }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versão inválida: '$VERSION'. Use semver, ex.: 0.2.0"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::A tag $TAG já existe."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Bump version
        run: |
          # Cargo workspace (todos os crates herdam `version.workspace = true`)
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const cargo = fs.readFileSync("Cargo.toml", "utf8");
            const re = /(\[workspace\.package\][^\[]*?\bversion\s*=\s*")[^"]*(")/;
            if (!re.test(cargo)) throw new Error("version não encontrada em [workspace.package]");
            fs.writeFileSync("Cargo.toml", cargo.replace(re, `$1${v}$2`));
            const confPath = "apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = v;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
          '
          # package.json + package-lock.json
          (cd apps/desktop && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          # Atualiza só os pacotes do workspace no Cargo.lock
          cargo update --workspace
          git --no-pager diff --stat

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test
        run: |
          cargo test --workspace --locked
          (cd apps/desktop && npm run check)

      - name: Build installer
        working-directory: apps/desktop
        env:
          # Assinatura do updater (`bundle.createUpdaterArtifacts`): gera o `*-setup.exe.sig`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY ausente: sem ela os apps instalados não conseguem se atualizar."
            exit 1
          fi
          npx tauri build

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p dist-release
          installer=$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)
          if [ -z "$installer" ]; then echo "::error::Instalador não encontrado"; exit 1; fi
          if [ ! -f "$installer.sig" ]; then echo "::error::Assinatura do updater ($installer.sig) não encontrada"; exit 1; fi
          name="Mirrorsight_${VERSION}_x64-setup.exe"
          cp "$installer" "dist-release/$name"
          cp "$installer.sig" "dist-release/$name.sig"
          (cd dist-release && sha256sum "$name" > SHA256SUMS.txt)
          cat dist-release/SHA256SUMS.txt

          # Manifesto lido pelos apps instalados (endpoint `releases/latest/download/latest.json`
          # em tauri.conf.json → pré-releases nunca são entregues pelo updater).
          NAME="$name" node -e '
            const fs = require("fs");
            const { VERSION, TAG, NAME, GITHUB_REPOSITORY } = process.env;
            const manifest = {
              version: VERSION,
              notes: `Mirrorsight ${TAG}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(`dist-release/${NAME}.sig`, "utf8").trim(),
                  url: `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}`,
                },
              },
            };
            fs.writeFileSync("dist-release/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cat dist-release/latest.json
          echo "installer=$name" >> "$GITHUB_OUTPUT"

      # A `main` é protegida (só aceita PR): o commit de versão vai num PR `release/vX.Y.Z`
      # que o próprio job mergeia; a tag aponta para o commit de merge que ficou na `main`.
      # Requer em Settings → Actions → General: "Allow GitHub Actions to create and approve pull requests".
      - name: Merge version bump & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/package-lock.json apps/desktop/src-tauri/tauri.conf.json

          if git diff --cached --quiet; then
            # Versão já estava nos manifestos: nada a mergear, a tag vai no commit atual.
            target=$(git rev-parse HEAD)
          else
            branch="release/$TAG"
            git switch -c "$branch"
            git commit -m "chore(release): $TAG"
            git push origin "$branch"

            url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
              --title "chore(release): $TAG" \
              --body "Atualiza a versão para $VERSION. PR aberto e mergeado automaticamente pela Action **Release**.")

            # Logo após criar, o GitHub ainda pode estar calculando se o PR é mergeável.
            merged=false
            for attempt in 1 2 3 4 5 6; do
              if gh pr merge "$url" --merge --subject "chore(release): $TAG"; then merged=true; break; fi
              echo "Merge ainda não disponível (tentativa $attempt); aguardando…"
              sleep 10
            done
            if [ "$merged" != true ]; then echo "::error::Não foi possível mergear $url"; exit 1; fi

            target=$(gh pr view "$url" --json mergeCommit -q .mergeCommit.oid)
            git push origin --delete "$branch" || true
            git fetch origin "$target"
          fi

          git tag -a "$TAG" "$target" -m "Mirrorsight $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        run: |
          installer="${{ steps.artifacts.outputs.installer }}"
          cat > notes.md <<EOF
          ## 📥 Download

          **Windows 10/11 (x64):** [\`$installer\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${installer})

          1. Baixe e execute o instalador. O Mirrorsight fica na bandeja do sistema.
          2. Em **Configurações → Geral**, escolha o jogo (PoE 1 / PoE 2) e a liga.
          3. No jogo, passe o mouse sobre um item e pressione **Ctrl + D**.

          > O instalador não é assinado digitalmente: se o Windows SmartScreen avisar,
          > clique em **Mais informações → Executar assim mesmo**.
          > Confira a integridade com o \`SHA256SUMS.txt\`.

          🔄 A partir da v0.4.0 o Mirrorsight se atualiza sozinho (desligue em **Configurações → Geral**).

          ---
          EOF

          flags=(--title "Mirrorsight $TAG" --notes-file notes.md --generate-notes --verify-tag)
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi

          gh release create "$TAG" "dist-release/$installer" "dist-release/$installer.sig" \
            dist-release/latest.json dist-release/SHA256SUMS.txt "${flags[@]}"
