[package]
name = "mirrorsight"
description = "Mirrorsight — overlay de price check para Path of Exile 1 e 2"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mirrorsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mirrorsight-domain.workspace = true
mirrorsight-parser.workspace = true
mirrorsight-application.workspace = true
mirrorsight-infrastructure.workspace = true
mirrorsight-gamedata.workspace = true

tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tokio = { workspace = true, features = ["time"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[lints]
workspace = true
