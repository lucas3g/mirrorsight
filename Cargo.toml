[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/parser",
    "crates/application",
    "crates/infrastructure",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
mirrorsight-domain = { path = "crates/domain" }
mirrorsight-parser = { path = "crates/parser" }
mirrorsight-application = { path = "crates/application" }
mirrorsight-infrastructure = { path = "crates/infrastructure" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
